[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vmforecast-lab"
version = "0.1.0"
description = "Causal CPU/RAM migration replay experiments"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "pandas==2.2.3", "pyarrow==17.0.0", "matplotlib==3.8.4", "plotly==5.24.1", "PyYAML==6.0.2"]

[project.optional-dependencies]
google = ["google-cloud-bigquery==3.25.0", "db-dtypes==1.3.0"]
dev = ["pytest==8.3.3", "nbformat==5.10.4", "nbclient==0.10.0", "ipykernel==6.29.5"]
local = ["notebook==7.2.2", "psutil==5.9.8", "setuptools==75.3.0", "wheel==0.44.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
